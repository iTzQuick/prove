<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#17191d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blocking">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <title>Blocking Studio</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
    } }
  </script>
</head>
<body>
  <header id="phoneHeader"></header>
  <header id="topbar">
    <div class="brand">◧ <span class="lbl">Blocking Studio <span class="sub">per Higgsfield</span></span></div>
    <div class="group" id="addMenu"></div>
    <div class="sep d-only"></div>
    <div id="toolsHome" class="group">
      <div class="group seg" id="toolSeg">
        <button data-tool="translate" title="Sposta (W)"><span class="ico">✥</span><span class="lbl">Sposta</span></button>
        <button data-tool="rotate" title="Ruota (E)"><span class="ico">⟳</span><span class="lbl">Ruota</span></button>
        <button data-tool="scale" title="Scala (R)"><span class="ico">⤢</span><span class="lbl">Scala</span></button>
      </div>
      <button id="poseBtn" class="toggle" title="Modalità posa: clicca un arto del manichino e ruotalo (P)"><span class="ico">🦴</span><span class="lbl">Posa</span></button>
      <div class="sep d-only"></div>
      <div class="group seg" id="viewSeg">
        <button data-view="free" title="Vista libera (V)"><span class="ico">🌐</span><span class="lbl">Vista libera</span></button>
        <button data-view="shot" title="Guarda dalla camera dello shot (V)"><span class="ico">🎥</span><span class="lbl">Camera shot</span></button>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button id="undoBtn" title="Annulla (Ctrl+Z)">↶</button>
      <button id="redoBtn" title="Ripeti (Ctrl+Shift+Z)">↷</button>
      <div class="dropdown">
        <button id="fileBtn" title="Progetto"><span class="ico">☰</span><span class="lbl">Progetto ▾</span></button>
        <div class="menu" id="fileMenu">
          <div class="menu-title">Progetto</div>
          <button data-act="new">Nuovo progetto</button>
          <button data-act="open">Apri progetto (.json)…</button>
          <button data-act="save">Salva progetto (.json)</button>
          <button data-act="lib">Importa libreria Elements (.json)…</button>
          <hr>
          <button data-act="demo">Carica scena demo</button>
        </div>
      </div>
      <div class="dropdown">
        <button id="exportBtn" title="Esporta"><span class="ico">⇩</span><span class="lbl">Esporta ▾</span></button>
        <div class="menu" id="exportMenu">
          <div class="menu-title">Esporta</div>
          <button data-act="still-start">Start frame blockout (PNG)</button>
          <button data-act="still-end">End frame blockout (PNG)</button>
          <button data-act="still-depth">Depth map start frame (PNG)</button>
          <button data-act="video">Video di blocking (@Video 1)</button>
          <button data-act="locpack">Location pack vuoto (3 viste PNG)</button>
          <hr>
          <button data-act="shotlist">Shot list (.md)</button>
          <button data-act="package">Pacchetto shot completo (.json)</button>
        </div>
      </div>
      <button id="promptBtn" class="primary d-only">Prompt Higgsfield</button>
    </div>
  </header>

  <aside id="left" class="sheet">
    <div class="sheet-head"><span class="grab"></span><b>Scena</b><button class="sheet-close" aria-label="Chiudi">✕</button></div>
    <section>
      <h3>Progetto</h3>
      <div id="metaForm"></div>
    </section>
    <section>
      <h3>Shot <button id="addShotBtn" class="mini" title="Nuovo shot">+</button><button id="dupShotBtn" class="mini" title="Duplica shot">⧉</button></h3>
      <div id="shotList"></div>
    </section>
    <section class="grow">
      <h3>Scena</h3>
      <div id="outliner"></div>
    </section>
  </aside>

  <main id="viewport">
    <canvas id="c"></canvas>
    <div id="frameGuide"><div class="thirds"></div><div class="safe"></div></div>
    <div id="hud"></div>
    <div id="hint"></div>
  </main>

  <aside id="right" class="sheet">
    <div class="sheet-head"><span class="grab"></span><b id="rightTitle">Oggetto</b><button class="sheet-close" aria-label="Chiudi">✕</button></div>
    <div class="tabs" id="inspTabs">
      <button data-tab="obj">Oggetto</button>
      <button data-tab="shot">Shot</button>
      <button data-tab="beats">Azione</button>
    </div>
    <div id="inspector"></div>
  </aside>

  <footer id="timeline">
    <div class="tl-controls">
      <button id="playBtn" title="Play/Pausa (Spazio)">▶</button>
      <span id="timeLabel">0.0 / 8 s</span>
      <button id="keyObjBtn" title="Key per l'oggetto selezionato al tempo attuale (K)">◆ <span class="lbl">Key oggetto</span><span class="m-lbl">Ogg.</span></button>
      <button id="keyCamBtn" title="Key per la camera dello shot (C)">◆ <span class="lbl">Key camera</span><span class="m-lbl">Cam</span></button>
      <button id="delKeyBtn" title="Elimina key al tempo attuale">✕<span class="lbl"> Key</span></button>
      <label class="chk d-only"><input type="checkbox" id="loopChk" checked> loop</label>
    </div>
    <canvas id="tl"></canvas>
  </footer>

  <section id="phonePanel"></section>
  <nav id="stepbar"></nav>
  <div id="phoneSheet" class="hidden"></div>

  <div id="modal" class="hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Prompt Higgsfield</h2>
        <button id="modalClose" aria-label="Chiudi">✕</button>
      </div>
      <div class="tabs" id="modalTabs"></div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="fileOffer" class="hidden"></div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
  <input type="file" id="libInput" accept=".json,application/json" hidden>
  <datalist id="elementsList"></datalist>
  <datalist id="elementsLocList"></datalist>
  <div id="toast"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
